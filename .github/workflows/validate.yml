name: Validate workbench
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install chain dependency
        run: python -m pip install -r requirements.txt
      - name: Check generated workflows
        run: python scripts/build_workbench.py --check
      - name: Validate launcher and local references
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate JavaScript and prompt behavior
        run: |
          node --check workbench/dist/app.js
          node --check workbench/dist/core.js
          node --check workbench/dist/workflows.js
          node --test tests/workbench.test.cjs
